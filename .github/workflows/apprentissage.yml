name: Apprentissage (parties de l'utilisateur)

# Quand un fichier de parties est déposé dans riftbound/train/games/games/ (téléchargé depuis « Mes parties » de la
# table), chaque partie est rejouée avec le moteur Rust actuel (les copies figées du moteur Python ont été supprimées à la
# bascule du 2026-11-24 : les rejeux non fidèles sont signalés), comparée au coach, et un bilan est publié dans le résumé
# du run et en artefact.
on:
  push:
    paths:
      - "riftbound/train/games/games/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git archive du commit noté par la page
      - name: Moteur Rust (outils de rejeu)
        run: cd rust && cargo build --release --bin train_games --bin bilan_parties
      - name: Rejouer toutes les parties avec le coach
        run: cd riftbound/engine && ../../rust/target/release/train_games ../train/games/games/*.json --frozen --coach
      - name: Bilan
        run: |
          cd riftbound/engine && ../../rust/target/release/bilan_parties > /dev/null
          cat ../train/analyses/BILAN.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: analyses-parties
          path: riftbound/train/analyses/
