name: Tests et table d'entraînement

# Les tests et la construction de la table tournent en parallèle ; la publication sur GitHub Pages
# n'a lieu (branche main uniquement) que si les deux ont réussi.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Porte d'intégration, partie moteur (wiki, tests, fuzz de chaque paquet, parties aléatoires)
        run: bash scripts/verifier.sh moteur

  build-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pyodide 0.26.4 (paquet npm)
        run: bash riftbound/train/fetch_pyodide.sh
      - name: Playwright, Chromium et serveur PeerJS local (robots navigateur)
        run: |
          cd riftbound/train
          npm install --no-save --no-package-lock playwright@1.56.1 peer@1.0.2
          npx playwright install --with-deps chromium
      - name: Porte d'intégration, partie table (construction + partie jouée au format téléphone)
        run: bash scripts/verifier.sh table
      - name: Page d'accueil du site
        run: |
          cp riftbound/train/build/train.html riftbound/train/build/index.html
          touch riftbound/train/build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: riftbound/train/build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tests, build-table]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
